server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Assets versionados do Next (hash no nome) — cache longo e imutável
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Mídia estática — cache moderado
    location ~* \.(webp|jpg|jpeg|png|mp4|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # Export do Next usa trailingSlash: true (pastas com index.html)
    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
}
